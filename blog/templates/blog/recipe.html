{% extends 'base.html' %}

{% block title %}{{ recipe.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <img src="{{ recipe.image.url }}" class="img-fluid rounded" alt="{{ recipe.title }}">
            <h1 class="mt-4">{{ recipe.title }}</h1>
            <div class="d-flex justify-content-between my-3">
                <span><i class="far fa-clock"></i> {{ recipe.cooking_time }}</span>
                <span><i class="fas fa-users"></i> {{ recipe.serving }}</span>
            </div>
            <h4>Malzemeler</h4>
            <div class="mb-4">
                {{ recipe.ingredients|safe }}
            </div>
            <h4>Hazırlanışı</h4>
            <div>
                {{ recipe.instructions|safe }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
