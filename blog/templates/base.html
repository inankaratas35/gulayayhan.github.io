<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Chef Gülay Ayhan{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        .navbar {
            background-color: rgba(255, 107, 107, 0.9) !important;
            position: fixed;
            width: 100%;
            z-index: 1000;
        }
        .card {
            transition: transform .2s;
            background-color: rgba(255, 255, 255, 0.9);
        }
        .card:hover {
            transform: scale(1.03);
        }
        .hero-section {
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        .hero-content {
            color: white;
            text-align: center;
            position: relative;
            z-index: 1;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .hero-title {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        .hero-subtitle {
            font-size: 1.5rem;
        }
        .content-section {
            padding-top: 80px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Chef Gülay Ayhan</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'home' %}">Ana Sayfa</a>
                <a class="nav-link" href="{% url 'about' %}">Hakkımda</a>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
